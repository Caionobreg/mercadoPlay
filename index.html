<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <title>Mercado Play</title>
</head>

<body>
    <header class="header">
        <div class="container1">

            <div class="search-container">

                    <img alt="logo-play" class="logo" src="./img/MercadoPlay.jpg">

                <div class="search-box">
                    <button id="searchBtn" class="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <input type="text" id="searchInput" placeholder="Buscar produtos... " class="search-input">

                </div>

            </div>

            <div class="right-header">
                <div id="userHeader" class="user-header">
                    <div id="userIcon" class="user-icon">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <div id="userInfo" class="user-info">
                        <h3>Olá, Seja Bem Vindo</h3>
                        <a href="">Entre ou cadastre-se</a>
                    </div>
                </div>

                <div id="cartHeader" class="cart-header">
                    <button id="cartBtn" class="cart-btn">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <section class="hero">

    </section>

    <main class="main">
        <div class="container">
            <h2 class="section-title">Ofetas do dia</h2>
            <div class="products-grid" id="productsGrid">


            </div>
        </div>

    </main>

    <footer class="footer">
        <p>Play no seu novo jeito de comprar - Developer:
            Caio Nóbrega</p>
    </footer>

    <script src="scripts.js"></script>
</body>

</html>
